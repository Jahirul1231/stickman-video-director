<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude-Style Stickman Animation Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #060810;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .studio-container {
      width: 95vw;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: linear-gradient(135deg, #00f0ff, #0077ff);
      color: #000;
      font-weight: 800;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #030408;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls-panel {
      background: rgba(15, 20, 32, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .timeline-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .time-label {
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #94a3b8;
      width: 85px;
    }
    .timeline-slider {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: #1e293b;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    .timeline-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #00f0ff;
      box-shadow: 0 0 10px #00f0ff;
      cursor: pointer;
    }
    .buttons-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    button:hover {
      background: #334155;
      border-color: rgba(255, 255, 255, 0.2);
    }
    button.primary {
      background: #00f0ff;
      color: #000;
      font-weight: 700;
      border: none;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    button.primary:hover {
      background: #38f4ff;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
    }
    button.record {
      background: #ff0055;
      color: #fff;
      font-weight: 700;
      border: none;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
    }
    button.record:hover {
      background: #ff2a73;
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.6);
    }
    button.recording {
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.7; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }
    .pill-select {
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="studio-container">
    <div class="header">
      <div class="title-group">
        <span class="badge">SAKUGA ENGINE</span>
        <h1>3D Anime Stickman Fight Studio</h1>
      </div>
      <div style="font-size: 13px; color: #64748b; font-weight: 600;">
        60 FPS · PHYSICS & MEDIARECORDER EXPORT
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="viewport" width="1920" height="1080"></canvas>
    </div>

    <div class="controls-panel">
      <div class="timeline-row">
        <div class="time-label" id="timeDisplay">0.00s / 10.0s</div>
        <input type="range" id="timeline" class="timeline-slider" min="0" max="600" value="0">
      </div>
      <div class="buttons-row">
        <div class="btn-group">
          <button id="playBtn" class="primary">▶ Play</button>
          <button id="restartBtn">↺ Restart</button>
          <select id="speedSelect" class="pill-select">
            <option value="0.25">0.25x (Slow-Mo)</option>
            <option value="0.5">0.5x</option>
            <option value="1.0" selected>1.0x (Normal)</option>
            <option value="1.5">1.5x (Fast)</option>
          </select>
        </div>
        <div class="btn-group">
          <button id="soundToggleBtn">🔊 Sound: ON</button>
          <button id="recordBtn" class="record">⏺ Record & Download Video</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('viewport');
    const ctx = canvas.getContext('2d');
    const playBtn = document.getElementById('playBtn');
    const restartBtn = document.getElementById('restartBtn');
    const timeline = document.getElementById('timeline');
    const timeDisplay = document.getElementById('timeDisplay');
    const speedSelect = document.getElementById('speedSelect');
    const recordBtn = document.getElementById('recordBtn');
    const soundToggleBtn = document.getElementById('soundToggleBtn');

    const TOTAL_FRAMES = 600; // 10.0 seconds at 60 FPS
    let currentFrame = 0;
    let isPlaying = true;
    let playbackSpeed = 1.0;
    let isRecording = false;
    let soundEnabled = true;

    // Web Audio Synthesizer (Zero external files needed)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
    }
    function playSfx(type) {
      if (!soundEnabled) return;
      initAudio();
      const t = audioCtx.currentTime;
      if (type === 'whoosh') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, t);
        osc.frequency.exponentialRampToValueAtTime(120, t + 0.15);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.15);
      } else if (type === 'hit') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.exponentialRampToValueAtTime(40, t + 0.25);
        gain.gain.setValueAtTime(0.8, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.25);
      } else if (type === 'bulletTime') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(80, t);
        osc.frequency.linearRampToValueAtTime(140, t + 0.8);
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.8);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.8);
      }
    }

    // Particle system for sparks and ground dust
    const particles = [];
    function spawnSparks(x, y, count = 25, color = '#00f0ff') {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 4 + Math.random() * 16;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          life: 1.0,
          decay: 0.02 + Math.random() * 0.04,
          color,
          size: 2 + Math.random() * 4
        });
      }
    }

    // Easing functions for Sakuga animation
    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }
    function easeInOutQuad(x) {
      return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
    }
    function lerp(a, b, t) { return a + (b - a) * t; }

    // Stickman Draw Function with Curved Limbs (Squash & Stretch)
    function drawCurvedStickman(ctx, { x, y, headSize = 28, torsoLen = 85, angle = 0, color = '#00f0ff', leftArm, rightArm, leftLeg, rightLeg }) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 10;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = color;
      ctx.shadowBlur = 18;

      // Head
      ctx.beginPath();
      ctx.arc(0, -torsoLen - headSize, headSize, 0, Math.PI * 2);
      ctx.fill();

      // Torso
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -torsoLen);
      ctx.stroke();

      // Limbs helper
      function drawLimb(shoulderX, shoulderY, jointX, jointY, handX, handY) {
        ctx.beginPath();
        ctx.moveTo(shoulderX, shoulderY);
        ctx.quadraticCurveTo(jointX, jointY, handX, handY);
        ctx.stroke();
      }

      // Arms
      drawLimb(0, -torsoLen * 0.9, leftArm.jx, leftArm.jy, leftArm.hx, leftArm.hy);
      drawLimb(0, -torsoLen * 0.9, rightArm.jx, rightArm.jy, rightArm.hx, rightArm.hy);

      // Legs
      drawLimb(0, 0, leftLeg.jx, leftLeg.jy, leftLeg.hx, leftLeg.hy);
      drawLimb(0, 0, rightLeg.jx, rightLeg.jy, rightLeg.hx, rightLeg.hy);

      ctx.restore();
    }

    // Render Scene at Frame f
    function render(f) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let camX = 0, camY = 0, camScale = 1.0, screenShake = 0;
      let slowMoText = false, impactText = false;

      // Ground plane grid
      const groundY = 820;

      // Animation Stages
      let cyanX = 500, cyanY = groundY, cyanAngle = 0;
      let redX = 1420, redY = groundY, redAngle = 0;

      // Limb default postures
      let c_la = { jx: -30, jy: -60, hx: -50, hy: -40 };
      let c_ra = { jx: 30, jy: -60, hx: 50, hy: -40 };
      let c_ll = { jx: -25, jy: 45, hx: -35, hy: 90 };
      let c_rl = { jx: 25, jy: 45, hx: 35, hy: 90 };

      let r_la = { jx: -30, jy: -60, hx: -50, hy: -40 };
      let r_ra = { jx: 30, jy: -60, hx: 50, hy: -40 };
      let r_ll = { jx: -25, jy: 45, hx: -35, hy: 90 };
      let r_rl = { jx: 25, jy: 45, hx: 35, hy: 90 };

      // STAGE 1: Standoff & Coiling (0 - 90)
      if (f < 90) {
        const breathe = Math.sin(f * 0.1) * 8;
        cyanY += breathe;
        redY -= breathe;
        camScale = 1.0 + (f / 90) * 0.05;
      }
      // STAGE 2: Explosive Dash & Rapid Exchange (90 - 240)
      else if (f < 240) {
        const t = (f - 90) / 150;
        const dashT = Math.min(1, (f - 90) / 40);
        cyanX = lerp(500, 850, easeOutBack(dashT));
        redX = lerp(1420, 1070, easeOutBack(dashT));

        const punch = Math.sin(f * 0.5);
        c_ra.hx = 80 * punch;
        r_la.hx = -80 * punch;

        if (f % 12 === 0) {
          playSfx('whoosh');
          spawnSparks((cyanX + redX) / 2, groundY - 80, 8, '#ffffff');
          screenShake = 6;
        }
        camScale = 1.15;
      }
      // STAGE 3: Aerial Launch (240 - 320)
      else if (f < 320) {
        const t = (f - 240) / 80;
        const leap = Math.sin(t * Math.PI) * 380;
        cyanX = lerp(850, 780, t);
        cyanY = groundY - leap;
        redX = lerp(1070, 1140, t);
        redY = groundY - leap * 1.1;

        cyanAngle = t * 0.8;
        redAngle = -t * 1.0;
        camScale = 1.1 + t * 0.2;
      }
      // STAGE 4: BULLET TIME & 270° CAMERA ORBIT (320 - 480)
      else if (f < 480) {
        slowMoText = true;
        const t = (f - 320) / 160;
        const floatY = 460 + Math.sin(t * Math.PI) * 30;
        cyanX = 860; cyanY = floatY;
        redX = 1060; redY = floatY - 20;

        // Chambered 360 roundhouse kick pose (Squash & Tension)
        cyanAngle = t * Math.PI * 1.8;
        c_rl.jx = 80; c_rl.jy = -40; c_rl.hx = 140; c_rl.hy = -20; // Extended striking leg
        c_ll.jx = -40; c_ll.jy = 30; c_ll.hx = -60; c_ll.hy = 70;

        // Seamless 3D parallax drift
        camX = Math.sin(t * Math.PI * 1.5) * 120;
        camY = Math.cos(t * Math.PI) * 40;
        camScale = 1.35 + Math.sin(t * Math.PI) * 0.15;

        if (f === 321) playSfx('bulletTime');
      }
      // STAGE 5: CRITICAL HIT-STOP & SLAM (480 - 540)
      else if (f < 540) {
        impactText = true;
        const t = (f - 480) / 60;

        // Hit-stop freeze for first 6 frames
        if (f < 486) {
          screenShake = 28;
          cyanX = 920; cyanY = 450;
          redX = 1040; redY = 450;
          c_rl.hx = 160; c_rl.hy = 0; // connected kick
          if (f === 481) {
            playSfx('hit');
            spawnSparks(980, 450, 45, '#ffffff');
            spawnSparks(980, 450, 30, '#ff0055');
          }
        } else {
          // Explosive recoil
          cyanY = lerp(450, groundY - 20, t);
          redX = lerp(1040, 1680, t);
          redY = lerp(450, groundY + 40, t);
          redAngle = -t * 6;
          screenShake = Math.max(0, (1 - t) * 18);
        }
      }
      // STAGE 6: HERO THREE-POINT RECOVERY (540 - 600)
      else {
        cyanX = 920; cyanY = groundY;
        redX = 1680; redY = groundY + 50; redAngle = -Math.PI / 2;
        // Superhero planted landing
        c_la = { jx: 10, jy: 30, hx: 20, hy: 70 }; // hand on floor
        c_rl = { jx: 60, jy: 40, hx: 90, hy: 80 };
        c_ll = { jx: -50, jy: 60, hx: -80, hy: 85 };
        camScale = 1.25;
      }

      // Camera transformation
      ctx.save();
      const shakeOffsetX = (Math.random() - 0.5) * screenShake * 2;
      const shakeOffsetY = (Math.random() - 0.5) * screenShake * 2;
      ctx.translate(canvas.width / 2 + camX + shakeOffsetX, canvas.height / 2 + camY + shakeOffsetY);
      ctx.scale(camScale, camScale);
      ctx.translate(-canvas.width / 2, -canvas.height / 2);

      // Arena Grid Floor (Perspective)
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.25)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY + 80);
      ctx.lineTo(canvas.width, groundY + 80);
      ctx.stroke();

      for (let x = -200; x < canvas.width + 400; x += 120) {
        ctx.beginPath();
        ctx.moveTo(x, groundY + 80);
        ctx.lineTo(x * 1.3 - canvas.width * 0.15, canvas.height);
        ctx.stroke();
      }

      // Draw Stickmen
      drawCurvedStickman(ctx, { x: cyanX, y: cyanY, angle: cyanAngle, color: '#00f0ff', leftArm: c_la, rightArm: c_ra, leftLeg: c_ll, rightLeg: c_rl });
      drawCurvedStickman(ctx, { x: redX, y: redY, angle: redAngle, color: '#ff0055', leftArm: r_la, rightArm: r_ra, leftLeg: r_ll, rightLeg: r_rl });

      // Update & Render Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.4; // gravity
        p.life -= p.decay;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      ctx.globalAlpha = 1.0;

      ctx.restore();

      // Cinematic Vignette / Overlays
      if (slowMoText) {
        ctx.fillStyle = 'rgba(0, 240, 255, 0.08)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = '800 24px -apple-system, sans-serif';
        ctx.fillStyle = '#00f0ff';
        ctx.letterSpacing = '6px';
        ctx.textAlign = 'center';
        ctx.fillText('● BULLET TIME · 0.15X SAKUGA DILATION', canvas.width / 2, 80);
      }
      if (impactText) {
        ctx.font = '900 72px -apple-system, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#ff0055';
        ctx.shadowBlur = 30;
        ctx.fillText('CRITICAL IMPACT', canvas.width / 2, 220);
      }
    }

    // Animation Loop
    let lastTime = performance.now();
    function loop(now) {
      if (isPlaying) {
        const delta = (now - lastTime) / 1000;
        currentFrame += 60 * delta * playbackSpeed;
        if (currentFrame >= TOTAL_FRAMES) {
          if (isRecording) stopRecording();
          currentFrame = 0;
        }
        timeline.value = Math.floor(currentFrame);
        timeDisplay.textContent = `${(currentFrame / 60).toFixed(2)}s / 10.0s`;
      }
      lastTime = now;
      render(Math.floor(currentFrame));
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // Timeline Controls
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
    });
    restartBtn.addEventListener('click', () => {
      currentFrame = 0;
      timeline.value = 0;
    });
    timeline.addEventListener('input', (e) => {
      currentFrame = parseFloat(e.target.value);
      timeDisplay.textContent = `${(currentFrame / 60).toFixed(2)}s / 10.0s`;
    });
    speedSelect.addEventListener('change', (e) => {
      playbackSpeed = parseFloat(e.target.value);
    });
    soundToggleBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundToggleBtn.textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    });

    // 1-Click Video Recording (MediaRecorder API)
    let mediaRecorder = null;
    let recordedChunks = [];
    recordBtn.addEventListener('click', () => {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    });

    function startRecording() {
      initAudio();
      isRecording = true;
      recordedChunks = [];
      currentFrame = 0;
      isPlaying = true;
      playbackSpeed = 1.0;
      recordBtn.textContent = '⏹ Stop & Save Video';
      recordBtn.classList.add('recording');

      const stream = canvas.captureStream(60);
      const options = { mimeType: 'video/webm;codecs=vp9' };
      try {
        mediaRecorder = new MediaRecorder(stream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'stickman_sakuga_fight.webm';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      mediaRecorder.start();
    }

    function stopRecording() {
      if (!isRecording) return;
      isRecording = false;
      recordBtn.textContent = '⏺ Record & Download Video';
      recordBtn.classList.remove('recording');
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }
  </script>
</body>
</html>
