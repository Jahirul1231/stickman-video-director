<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude-Style Stickman Sakuga Animation Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #05070e;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow-x: hidden;
    }
    .studio-container {
      width: 96vw;
      max-width: 1280px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: linear-gradient(135deg, #00f0ff, #0077ff);
      color: #000;
      font-weight: 800;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    
    /* Command Prompt Bar */
    .command-bar-wrapper {
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.25);
      padding: 6px 10px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
      align-items: center;
    }
    .command-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      padding: 4px 8px;
    }
    .command-input::placeholder {
      color: #64748b;
    }
    .quick-preset-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .quick-preset-btn:hover, .quick-preset-btn.active {
      background: #00f0ff;
      color: #000;
      border-color: #00f0ff;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #020306;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    
    .controls-panel {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .timeline-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .time-label {
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #94a3b8;
      width: 85px;
    }
    .timeline-slider {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: #1e293b;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    .timeline-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #00f0ff;
      box-shadow: 0 0 10px #00f0ff;
      cursor: pointer;
    }
    .buttons-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    button:hover {
      background: #334155;
      border-color: rgba(255, 255, 255, 0.2);
    }
    button.primary {
      background: #00f0ff;
      color: #000;
      font-weight: 700;
      border: none;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    button.primary:hover {
      background: #38f4ff;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
    }
    button.record {
      background: #ff0055;
      color: #fff;
      font-weight: 700;
      border: none;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
    }
    button.record:hover {
      background: #ff2a73;
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.6);
    }
    button.recording {
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.7; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }
    .pill-select {
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="studio-container">
    <div class="header">
      <div class="title-group">
        <span class="badge">STEP 1 ACTIVE</span>
        <h1>Claude-Style Stickman Sakuga Studio</h1>
      </div>
      <div style="font-size: 12px; color: #64748b; font-weight: 600;">
        PROMPT COMMANDS · WEAPONS & SUPERNATURAL VFX · 60 FPS
      </div>
    </div>

    <!-- 💬 Prompt Command Bar -->
    <div class="command-bar-wrapper">
      <span style="font-size: 15px;">💬</span>
      <input type="text" id="commandInput" class="command-input" placeholder="Type an animation prompt (e.g., 'Katana clash', 'Energy blast', 'Teleportation strike')...">
      <button id="commandSubmit" class="primary" style="padding: 5px 12px;">Run Prompt</button>
      <div style="width: 1px; height: 18px; background: rgba(255,255,255,0.15); margin: 0 4px;"></div>
      <button class="quick-preset-btn active" data-choreography="katana">⚔️ Katana Duel</button>
      <button class="quick-preset-btn" data-choreography="energy">⚡ Energy Blast</button>
      <button class="quick-preset-btn" data-choreography="teleport">🌀 Teleport Clash</button>
      <button class="quick-preset-btn" data-choreography="martial">🥋 Martial Arts</button>
    </div>

    <div class="canvas-wrapper">
      <canvas id="viewport" width="1920" height="1080"></canvas>
    </div>

    <div class="controls-panel">
      <div class="timeline-row">
        <div class="time-label" id="timeDisplay">0.00s / 10.0s</div>
        <input type="range" id="timeline" class="timeline-slider" min="0" max="600" value="0">
      </div>
      <div class="buttons-row">
        <div class="btn-group">
          <button id="playBtn" class="primary">▶ Play</button>
          <button id="restartBtn">↺ Restart</button>
          <select id="speedSelect" class="pill-select">
            <option value="0.25">0.25x (Slow-Mo)</option>
            <option value="0.5">0.5x</option>
            <option value="1.0" selected>1.0x (Normal)</option>
            <option value="1.5">1.5x (Fast)</option>
          </select>
        </div>
        <div class="btn-group">
          <button id="soundToggleBtn">🔊 Sound: ON</button>
          <button id="recordBtn" class="record">⏺ Record & Download Video</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('viewport');
    const ctx = canvas.getContext('2d');
    const playBtn = document.getElementById('playBtn');
    const restartBtn = document.getElementById('restartBtn');
    const timeline = document.getElementById('timeline');
    const timeDisplay = document.getElementById('timeDisplay');
    const speedSelect = document.getElementById('speedSelect');
    const recordBtn = document.getElementById('recordBtn');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const commandInput = document.getElementById('commandInput');
    const commandSubmit = document.getElementById('commandSubmit');
    const presetBtns = document.querySelectorAll('.quick-preset-btn');

    const TOTAL_FRAMES = 600; // 10.0 seconds at 60 FPS
    let currentFrame = 0;
    let isPlaying = true;
    let playbackSpeed = 1.0;
    let isRecording = false;
    let soundEnabled = true;
    let activeChoreography = 'katana'; // 'katana' | 'energy' | 'teleport' | 'martial'

    // Preset Switching
    function setChoreography(type) {
      activeChoreography = type;
      presetBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.choreography === type);
      });
      currentFrame = 0;
      timeline.value = 0;
    }

    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => setChoreography(btn.dataset.choreography));
    });

    commandSubmit.addEventListener('click', handleCommand);
    commandInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleCommand();
    });

    function handleCommand() {
      const q = commandInput.value.toLowerCase().trim();
      if (!q) return;
      if (q.includes('energy') || q.includes('beam') || q.includes('blast') || q.includes('laser')) {
        setChoreography('energy');
      } else if (q.includes('teleport') || q.includes('flash') || q.includes('portal') || q.includes('shunpo')) {
        setChoreography('teleport');
      } else if (q.includes('martial') || q.includes('punch') || q.includes('kick') || q.includes('kung fu')) {
        setChoreography('martial');
      } else {
        setChoreography('katana');
      }
      commandInput.value = '';
    }

    // Web Audio Synthesizer for SFX
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
    }
    function playSfx(type) {
      if (!soundEnabled) return;
      initAudio();
      const t = audioCtx.currentTime;
      if (type === 'whoosh') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, t);
        osc.frequency.exponentialRampToValueAtTime(100, t + 0.14);
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.14);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.14);
      } else if (type === 'swordClang') {
        // Metallic dual chime
        [1600, 2400].forEach(freq => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.4, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(t); osc.stop(t + 0.35);
        });
      } else if (type === 'laser') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, t);
        osc.frequency.exponentialRampToValueAtTime(80, t + 0.4);
        gain.gain.setValueAtTime(0.5, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.4);
      } else if (type === 'teleport') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(120, t);
        osc.frequency.linearRampToValueAtTime(600, t + 0.15);
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.15);
      } else if (type === 'hit') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160, t);
        osc.frequency.exponentialRampToValueAtTime(35, t + 0.28);
        gain.gain.setValueAtTime(0.8, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.28);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.28);
      } else if (type === 'bulletTime') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(90, t);
        osc.frequency.linearRampToValueAtTime(160, t + 0.8);
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.8);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.8);
      }
    }

    // Particle System
    const particles = [];
    function spawnSparks(x, y, count = 25, color = '#00f0ff') {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 4 + Math.random() * 16;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          life: 1.0,
          decay: 0.02 + Math.random() * 0.04,
          color,
          size: 2 + Math.random() * 4
        });
      }
    }

    // Easing helpers
    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }
    function lerp(a, b, t) { return a + (b - a) * t; }

    // Weapon & VFX Drawing Functions
    function drawKatana(ctx, x, y, angle, length = 110, color = '#00f0ff') {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      // Glowing Blade
      ctx.strokeStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 18;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(length, 0);
      ctx.stroke();
      // White core
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(length - 5, 0);
      ctx.stroke();
      // Tsuba (guard)
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-2, -6, 4, 12);
      ctx.restore();
    }

    function drawSlashArc(ctx, x, y, radius, startAngle, endAngle, color = '#00f0ff') {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 25;
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.arc(x, y, radius, startAngle, endAngle);
      ctx.stroke();
      // Inner bright core
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(x, y, radius, startAngle + 0.1, endAngle - 0.1);
      ctx.stroke();
      ctx.restore();
    }

    function drawEnergyBeam(ctx, startX, startY, endX, endY, radius = 24, color = '#ff0055') {
      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = 30;
      ctx.strokeStyle = color;
      ctx.lineWidth = radius;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      // Inner white blast core
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = radius * 0.4;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      // Energy sparks along beam
      for (let i = 0; i < 4; i++) {
        const t = Math.random();
        const px = lerp(startX, endX, t) + (Math.random() - 0.5) * 40;
        const py = lerp(startY, endY, t) + (Math.random() - 0.5) * 40;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(px, py, 6, 6);
      }
      ctx.restore();
    }

    function drawAura(ctx, x, y, radius = 60, color = '#00f0ff') {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 25;
      ctx.lineWidth = 3;
      for (let i = 0; i < 3; i++) {
        const offset = (Date.now() * 0.005 + i * 2) % (Math.PI * 2);
        ctx.beginPath();
        ctx.arc(x, y - 60, radius + Math.sin(offset) * 8, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    // Curved Stickman Drawing Function (Squash & Stretch)
    function drawCurvedStickman(ctx, { x, y, headSize = 28, torsoLen = 85, angle = 0, color = '#00f0ff', leftArm, rightArm, leftLeg, rightLeg, aura = false }) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      if (aura) drawAura(ctx, 0, 0, 80, color);

      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 10;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = color;
      ctx.shadowBlur = 18;

      // Head
      ctx.beginPath();
      ctx.arc(0, -torsoLen - headSize, headSize, 0, Math.PI * 2);
      ctx.fill();

      // Torso
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -torsoLen);
      ctx.stroke();

      function drawLimb(sx, sy, jx, jy, hx, hy) {
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.quadraticCurveTo(jx, jy, hx, hy);
        ctx.stroke();
      }

      drawLimb(0, -torsoLen * 0.9, leftArm.jx, leftArm.jy, leftArm.hx, leftArm.hy);
      drawLimb(0, -torsoLen * 0.9, rightArm.jx, rightArm.jy, rightArm.hx, rightArm.hy);
      drawLimb(0, 0, leftLeg.jx, leftLeg.jy, leftLeg.hx, leftLeg.hy);
      drawLimb(0, 0, rightLeg.jx, rightLeg.jy, rightLeg.hx, rightLeg.hy);

      ctx.restore();
    }

    // Main Render Pipeline
    function render(f) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let camX = 0, camY = 0, camScale = 1.0, screenShake = 0;
      let overlayTitle = '', overlaySubtitle = '';
      const groundY = 820;

      let cyanX = 500, cyanY = groundY, cyanAngle = 0;
      let redX = 1420, redY = groundY, redAngle = 0;

      let c_la = { jx: -30, jy: -60, hx: -50, hy: -40 };
      let c_ra = { jx: 30, jy: -60, hx: 50, hy: -40 };
      let c_ll = { jx: -25, jy: 45, hx: -35, hy: 90 };
      let c_rl = { jx: 25, jy: 45, hx: 35, hy: 90 };

      let r_la = { jx: -30, jy: -60, hx: -50, hy: -40 };
      let r_ra = { jx: 30, jy: -60, hx: 50, hy: -40 };
      let r_ll = { jx: -25, jy: 45, hx: -35, hy: 90 };
      let r_rl = { jx: 25, jy: 45, hx: 35, hy: 90 };

      let hasKatanaCyan = false, katanaCyanAngle = 0;
      let hasKatanaRed = false, katanaRedAngle = 0;
      let drawSlash = false, slashParams = null;
      let drawBeam = false, beamParams = null;
      let cyanAura = false, redAura = false;

      // ==========================================
      // CHOREOGRAPHY 1: ⚔️ KATANA DUEL
      // ==========================================
      if (activeChoreography === 'katana') {
        hasKatanaCyan = true;
        hasKatanaRed = true;

        if (f < 90) {
          overlayTitle = 'BLADE STANCE';
          overlaySubtitle = 'PLASMA KATANA READY';
          katanaCyanAngle = -0.6;
          katanaRedAngle = -2.5;
        } else if (f < 240) {
          // Dash & Rapid Sword Clash
          const dashT = Math.min(1, (f - 90) / 35);
          cyanX = lerp(500, 880, easeOutBack(dashT));
          redX = lerp(1420, 1040, easeOutBack(dashT));

          katanaCyanAngle = Math.sin(f * 0.4) * 1.5;
          katanaRedAngle = -Math.PI + Math.cos(f * 0.4) * 1.5;

          if (f % 14 === 0) {
            playSfx('swordClang');
            spawnSparks((cyanX + redX) / 2 + 10, groundY - 70, 16, '#ffffff');
            spawnSparks((cyanX + redX) / 2 + 10, groundY - 70, 12, '#00f0ff');
            screenShake = 7;
          }
          camScale = 1.15;
          overlayTitle = 'CLASH OF BLADES';
          overlaySubtitle = 'HIGH VELOCITY DEFLECTION';
        } else if (f < 360) {
          // Aerial Launch with Curved Slash Arc
          const t = (f - 240) / 120;
          const leap = Math.sin(t * Math.PI) * 360;
          cyanX = lerp(880, 800, t); cyanY = groundY - leap;
          redX = lerp(1040, 1120, t); redY = groundY - leap * 1.1;

          katanaCyanAngle = t * Math.PI * 3;
          katanaRedAngle = -t * Math.PI * 2;

          drawSlash = true;
          slashParams = { x: cyanX, y: cyanY - 80, r: 160, s: t * 4, e: t * 4 + 1.6, col: '#00f0ff' };

          camScale = 1.25;
          overlayTitle = 'AERIAL SAKUGA';
          overlaySubtitle = '360° CRESCENT SLICE';
        } else if (f < 480) {
          // Bullet Time Sword Lock
          overlayTitle = '● BULLET TIME · BLADE LOCK';
          overlaySubtitle = '0.15X SPATIAL SUSPENSION';
          const t = (f - 360) / 120;
          cyanX = 890; cyanY = 460;
          redX = 1030; redY = 460;
          katanaCyanAngle = -0.3;
          katanaRedAngle = -2.8;

          camX = Math.sin(t * Math.PI * 1.5) * 140;
          camScale = 1.38;
          cyanAura = true; redAura = true;

          if (f === 361) playSfx('bulletTime');
        } else {
          // Final Critical Strike & Sheathe
          overlayTitle = 'CRITICAL SLASH';
          overlaySubtitle = 'ONE-STRIKE FINISH';
          const t = (f - 480) / 120;
          if (f < 490) {
            screenShake = 30;
            if (f === 482) {
              playSfx('swordClang');
              playSfx('hit');
              spawnSparks(960, 460, 60, '#ffffff');
              spawnSparks(960, 460, 40, '#00f0ff');
            }
          }
          cyanX = 1200; cyanY = groundY;
          redX = 800; redY = groundY + 40; redAngle = Math.PI / 2;
          katanaCyanAngle = -1.2;
          camScale = 1.2;
        }
      }

      // ==========================================
      // CHOREOGRAPHY 2: ⚡ ENERGY BLAST & BEAM
      // ==========================================
      else if (activeChoreography === 'energy') {
        if (f < 120) {
          overlayTitle = 'AURA CHARGE';
          overlaySubtitle = 'CONCENTRATING PLASMA ENERGY';
          redAura = true;
          // Red charges a massive energy orb in hands
          r_ra.hx = -70; r_ra.hy = -60;
          r_la.hx = -50; r_la.hy = -60;
          if (f % 20 === 0) spawnSparks(redX - 60, groundY - 60, 6, '#ff0055');
        } else if (f < 320) {
          // Crimson Fires Massive Laser Beam!
          drawBeam = true;
          redAura = true;
          beamParams = { sx: redX - 60, sy: groundY - 60, ex: 100, ey: groundY - 60, w: 55, col: '#ff0055' };

          if (f === 121) playSfx('laser');

          // Cyan sliding dodge & deflection
          const t = (f - 120) / 200;
          cyanX = lerp(500, 720, t);
          cyanY = groundY + 30; // low slide
          cyanAngle = 0.8;
          cyanAura = true;
          screenShake = 8;

          overlayTitle = 'HYPER BEAM BLAST';
          overlaySubtitle = 'KINETIC ENERGY DISCHARGE';
        } else {
          // Cyan Leap & Energy Counter Slam
          const t = (f - 320) / 280;
          overlayTitle = 'COUNTER COLLAPSE';
          overlaySubtitle = 'PLASMA SURGE FINISH';

          cyanX = lerp(720, redX - 60, Math.min(1, t * 1.5));
          cyanY = groundY - Math.sin(t * Math.PI) * 400;
          cyanAura = true;

          if (f > 420 && f < 430) {
            screenShake = 26;
            if (f === 422) {
              playSfx('hit');
              spawnSparks(redX, groundY, 50, '#00f0ff');
              spawnSparks(redX, groundY, 40, '#ff0055');
            }
          }
        }
      }

      // ==========================================
      // CHOREOGRAPHY 3: 🌀 TELEPORT CLASH (SHUNPO)
      // ==========================================
      else if (activeChoreography === 'teleport') {
        overlayTitle = 'INSTANT TELEPORTATION';
        overlaySubtitle = 'SHUNPO HIGH-SPEED FLASH';

        const step = Math.floor(f / 60);
        if (f % 60 === 0) {
          playSfx('teleport');
          spawnSparks(cyanX, cyanY - 50, 18, '#00f0ff');
        }
        if (step % 2 === 0) {
          cyanX = 600; cyanY = groundY;
          redX = 1300; redY = groundY;
        } else {
          // Instant transmission to behind Red!
          cyanX = 1420; cyanY = groundY - 180;
          redX = 1200; redY = groundY;
          c_ra.hx = -80; // strike from behind
          screenShake = 12;
        }
        camScale = 1.25;
      }

      // ==========================================
      // CHOREOGRAPHY 4: 🥋 MARTIAL ARTS SAKUGA (Core)
      // ==========================================
      else {
        overlayTitle = 'SAKUGA MARTIAL ARTS';
        overlaySubtitle = 'HAND-TO-HAND KINEMATICS';
        if (f < 240) {
          const dashT = Math.min(1, (f - 60) / 35);
          if (f > 60) {
            cyanX = lerp(500, 850, easeOutBack(dashT));
            redX = lerp(1420, 1070, easeOutBack(dashT));
            const punch = Math.sin(f * 0.5);
            c_ra.hx = 80 * punch; r_la.hx = -80 * punch;
            if (f % 12 === 0) {
              playSfx('whoosh');
              spawnSparks((cyanX + redX) / 2, groundY - 80, 8, '#ffffff');
              screenShake = 6;
            }
          }
        } else if (f < 480) {
          // Bullet time slow mo
          overlayTitle = '● BULLET TIME · 0.15X SLOW-MO';
          overlaySubtitle = 'MID-AIR 360° ROUNDHOUSE';
          const t = (f - 240) / 240;
          cyanX = 860; cyanY = 460 + Math.sin(t * Math.PI) * 30;
          redX = 1060; redY = 440;
          cyanAngle = t * Math.PI * 1.8;
          c_rl.jx = 80; c_rl.jy = -40; c_rl.hx = 140; c_rl.hy = -20;
          camX = Math.sin(t * Math.PI * 1.5) * 120;
          camScale = 1.35;
          if (f === 241) playSfx('bulletTime');
        } else {
          // Critical hit & landing
          overlayTitle = 'CRITICAL IMPACT';
          overlaySubtitle = 'HERO RECOVERY SLAM';
          if (f < 490) {
            screenShake = 26;
            if (f === 482) {
              playSfx('hit');
              spawnSparks(980, 450, 45, '#ffffff');
              spawnSparks(980, 450, 30, '#ff0055');
            }
          }
          cyanX = 920; cyanY = groundY;
          redX = 1680; redY = groundY + 40; redAngle = -Math.PI / 2;
        }
      }

      // Camera transformation
      ctx.save();
      const shakeOffsetX = (Math.random() - 0.5) * screenShake * 2;
      const shakeOffsetY = (Math.random() - 0.5) * screenShake * 2;
      ctx.translate(canvas.width / 2 + camX + shakeOffsetX, canvas.height / 2 + camY + shakeOffsetY);
      ctx.scale(camScale, camScale);
      ctx.translate(-canvas.width / 2, -canvas.height / 2);

      // Arena Grid Floor (3D Perspective)
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY + 80);
      ctx.lineTo(canvas.width, groundY + 80);
      ctx.stroke();

      for (let x = -200; x < canvas.width + 400; x += 120) {
        ctx.beginPath();
        ctx.moveTo(x, groundY + 80);
        ctx.lineTo(x * 1.3 - canvas.width * 0.15, canvas.height);
        ctx.stroke();
      }

      // Render Weapons & Visual Effects
      if (drawBeam && beamParams) {
        drawEnergyBeam(ctx, beamParams.sx, beamParams.sy, beamParams.ex, beamParams.ey, beamParams.w, beamParams.col);
      }
      if (drawSlash && slashParams) {
        drawSlashArc(ctx, slashParams.x, slashParams.y, slashParams.r, slashParams.s, slashParams.e, slashParams.col);
      }

      // Draw Stickmen with curved limbs
      drawCurvedStickman(ctx, { x: cyanX, y: cyanY, angle: cyanAngle, color: '#00f0ff', leftArm: c_la, rightArm: c_ra, leftLeg: c_ll, rightLeg: c_rl, aura: cyanAura });
      drawCurvedStickman(ctx, { x: redX, y: redY, angle: redAngle, color: '#ff0055', leftArm: r_la, rightArm: r_ra, leftLeg: r_ll, rightLeg: r_rl, aura: redAura });

      // Draw Katanas if active
      if (hasKatanaCyan) {
        drawKatana(ctx, cyanX + c_ra.hx, cyanY - 80 + c_ra.hy, katanaCyanAngle, 110, '#00f0ff');
      }
      if (hasKatanaRed) {
        drawKatana(ctx, redX + r_la.hx, redY - 80 + r_la.hy, katanaRedAngle, 110, '#ff0055');
      }

      // Render Sparks & Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.4;
        p.life -= p.decay;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      ctx.globalAlpha = 1.0;

      ctx.restore();

      // Top Title Overlay
      if (overlayTitle) {
        ctx.save();
        ctx.font = '900 48px -apple-system, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 25;
        ctx.fillText(overlayTitle, canvas.width / 2, 90);

        if (overlaySubtitle) {
          ctx.font = '700 20px -apple-system, sans-serif';
          ctx.fillStyle = '#00f0ff';
          ctx.letterSpacing = '4px';
          ctx.fillText(overlaySubtitle, canvas.width / 2, 130);
        }
        ctx.restore();
      }
    }

    // Animation Loop
    let lastTime = performance.now();
    function loop(now) {
      if (isPlaying) {
        const delta = (now - lastTime) / 1000;
        currentFrame += 60 * delta * playbackSpeed;
        if (currentFrame >= TOTAL_FRAMES) {
          if (isRecording) stopRecording();
          currentFrame = 0;
        }
        timeline.value = Math.floor(currentFrame);
        timeDisplay.textContent = `${(currentFrame / 60).toFixed(2)}s / 10.0s`;
      }
      lastTime = now;
      render(Math.floor(currentFrame));
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // Controls
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
    });
    restartBtn.addEventListener('click', () => {
      currentFrame = 0;
      timeline.value = 0;
    });
    timeline.addEventListener('input', (e) => {
      currentFrame = parseFloat(e.target.value);
      timeDisplay.textContent = `${(currentFrame / 60).toFixed(2)}s / 10.0s`;
    });
    speedSelect.addEventListener('change', (e) => {
      playbackSpeed = parseFloat(e.target.value);
    });
    soundToggleBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundToggleBtn.textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    });

    // 1-Click Video Recording (MediaRecorder API)
    let mediaRecorder = null;
    let recordedChunks = [];
    recordBtn.addEventListener('click', () => {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    });

    function startRecording() {
      initAudio();
      isRecording = true;
      recordedChunks = [];
      currentFrame = 0;
      isPlaying = true;
      playbackSpeed = 1.0;
      recordBtn.textContent = '⏹ Stop & Save Video';
      recordBtn.classList.add('recording');

      const stream = canvas.captureStream(60);
      const options = { mimeType: 'video/webm;codecs=vp9' };
      try {
        mediaRecorder = new MediaRecorder(stream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `stickman_${activeChoreography}_fight.webm`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      mediaRecorder.start();
    }

    function stopRecording() {
      if (!isRecording) return;
      isRecording = false;
      recordBtn.textContent = '⏺ Record & Download Video';
      recordBtn.classList.remove('recording');
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }
  </script>
</body>
